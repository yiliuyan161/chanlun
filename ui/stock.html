<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>缠论 — 股票</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#131722; font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; color:#d1d4dc; }
  .top { display:flex; align-items:center; gap:16px; padding:12px 20px; border-bottom:1px solid #2a2e39; background:#1c2030; }
  .top a { color:#58a6ff; text-decoration:none; font-size:14px; }
  .top h1 { font-size:18px; }
  .top .name { color:#8b949e; font-size:14px; }
  #chart { position:relative; width:100%; height:calc(100vh - 58px); }
</style>
</head>
<body>
<div class="top">
  <a href="/">← 返回</a>
  <h1 id="sym">加载中…</h1>
  <span class="name" id="name"></span>
</div>
<div id="chart"></div>

<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script src="/chan-primitives.js?v=4"></script>
<script>
const symbol = location.pathname.split('/').pop();
const container = document.getElementById('chart');
const chart = LightweightCharts.createChart(container, {
  layout: { background:{type:'solid',color:'#131722'}, textColor:'#d1d4dc' },
  grid: { vertLines:{color:'#1e222d'}, horzLines:{color:'#1e222d'} },
  rightPriceScale: { borderColor:'#2a2e39' },
  timeScale: { borderColor:'#2a2e39', timeVisible:false },
  crosshair: { mode: 0 },
  autoSize: true,
});

const candleSeries = chart.addCandlestickSeries({
  upColor:'#26a69a', downColor:'#ef5350', borderVisible:false, wickUpColor:'#26a69a', wickDownColor:'#ef5350',
});
const biSeries = chart.addLineSeries({ color:'#58a6ff', lineWidth:2, priceLineVisible:false, lastValueVisible:false });
const volumeSeries = chart.addHistogramSeries({ priceFormat:{type:'volume'}, priceScaleId:'vol' });
chart.priceScale('vol').applyOptions({ scaleMargins:{ top:0.82, bottom:0 } });

// 买卖点 markers 颜色
const MARK_COLORS = {
  buy1:'#26a69a', buy2:'#2ecc71', buy3:'#00e5ff',
  sell1:'#ef5350', sell2:'#ff7043', sell3:'#ffd700',
};

async function init() {
  try {
    const r = await fetch(`/api/kline/${symbol}?limit=1500`);
    if (!r.ok) { alert('股票不存在或加载失败'); return; }
    const data = await r.json();
    document.getElementById('sym').textContent = data.symbol;

    candleSeries.setData(data.klines);

    // 成交量
    const vols = data.klines.map((k,i) => {
      const prev = i>0 ? data.klines[i-1] : null;
      const up = !prev || k.close >= prev.close;
      return { time:k.time, value:k.vol ?? 0, color: up ? 'rgba(38,166,154,0.4)' : 'rgba(239,83,80,0.4)' };
    });
    volumeSeries.setData(vols);

    // 笔 → 连续折线 (方向中文判断, 去重共享端点)
    if (data.bis && data.bis.length) {
      const pts = [];
      let lastTime = null;
      data.bis.forEach(b => {
        const isUp = String(b.direction).includes('向上');
        const sP = isUp ? b.low : b.high;
        const eP = isUp ? b.high : b.low;
        if (b.sdt !== lastTime) pts.push({ time:b.sdt, value:sP });
        pts.push({ time:b.edt, value:eP });
        lastTime = b.edt;
      });
      biSeries.setData(pts);
    }

    // 中枢矩形 — 官方 primitive API (v4 需显式传 chart)
    if (data.zs && data.zs.length) {
      const zones = data.zs.map(z => ({ sdt:z.sdt, edt:z.edt, zg:z.zg, zd:z.zd }));
      candleSeries.attachPrimitive(new ZsRectanglePrimitive(candleSeries, zones, chart));
    }

    // 买卖点 markers
    if (data.points && data.points.length) {
      const markers = data.points.map(p => ({
        time: p.time,
        position: p.type.startsWith('buy') ? 'belowBar' : 'aboveBar',
        color: MARK_COLORS[p.type] || '#fff',
        shape: p.type.startsWith('buy') ? 'arrowUp' : 'arrowDown',
        text: p.label,
      }));
      candleSeries.setMarkers(markers);
    }

    chart.timeScale().fitContent();
  } catch (e) { console.error(e); }
}
init();
</script>
</body>
</html>
