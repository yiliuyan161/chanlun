<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A股缠论 — 中枢可视化</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
         background:#0d1117; color:#e6edf3; }
  .wrap { max-width:1100px; margin:0 auto; padding:32px 20px; }
  h1 { font-size:24px; margin-bottom:6px; }
  .sub { color:#8b949e; font-size:13px; margin-bottom:24px; }
  #search { width:100%; max-width:480px; padding:12px 16px; font-size:16px;
            border-radius:10px; border:1px solid #30363d; background:#161b22;
            color:#e6edf3; outline:none; }
  #search:focus { border-color:#58a6ff; }
  .count { color:#8b949e; font-size:13px; margin:12px 2px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; }
  .card { display:block; padding:14px 16px; background:#161b22; border:1px solid #30363d;
          border-radius:10px; text-decoration:none; color:#e6edf3; transition:border-color .15s; }
  .card:hover { border-color:#58a6ff; }
  .card .sym { font-weight:600; font-size:15px; }
  .card .ex { color:#58a6ff; font-size:12px; margin-left:6px; }
  .card .name { color:#c9d1d9; font-size:13px; margin-top:4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📈 A股缠论 — 中枢可视化</h1>
  <div class="sub">czsc 缠论结构 · lightweight-charts 渲染 · 数据每日更新</div>
  <input id="search" type="text" placeholder="搜索代码或名称，如 600519 / 茅台" autofocus>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
</div>
<script>
const grid = document.getElementById('grid');
const count = document.getElementById('count');
const search = document.getElementById('search');
let symbols = [];

async function load() {
  try {
    const r = await fetch('/api/symbols');
    symbols = await r.json();
    render('');
  } catch (e) { console.error(e); }
}

function render(q) {
  q = (q||'').toLowerCase().trim();
  const list = q ? symbols.filter(s => s.thscode.toLowerCase().includes(q)
                                   || (s.name && s.name.toLowerCase().includes(q))
                                   || s.ticker.toLowerCase().includes(q)) : symbols;
  count.textContent = `${list.length} / ${symbols.length} 只`;
  grid.innerHTML = list.slice(0, 500).map(s => `
    <a class="card" href="/stock/${s.thscode}">
      <div class="sym">${s.thscode}<span class="ex">${s.exchange}</span></div>
      <div class="name">${s.name || ''}</div>
    </a>`).join('');
}
search.addEventListener('input', e => render(e.target.value));
document.addEventListener('keydown', e => { if (e.key === 'Enter' && list.length) location.href = list[0].pathname; });
load();
</script>
</body>
</html>
